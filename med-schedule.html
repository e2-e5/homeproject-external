<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>График приёма таблеток</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:-apple-system,'Segoe UI',Helvetica,sans-serif;background:#F0F4F8;color:#1A202C;}
body{min-height:100vh;padding-bottom:48px;}

.hdr{background:linear-gradient(135deg,#1A202C,#2D3748);color:#fff;padding:20px 20px 16px;text-align:center;}
.hdr h1{font-size:19px;font-weight:700;margin-bottom:3px;letter-spacing:-.3px;}
.hdr .dates{font-size:12px;color:#90CDF4;margin-bottom:12px;}
.g-bar-wrap{background:rgba(255,255,255,.1);border-radius:99px;height:10px;overflow:hidden;}
.g-bar{background:linear-gradient(90deg,#48BB78,#38A169);height:100%;border-radius:99px;transition:width .4s;}
.g-label{font-size:12px;color:#CBD5E0;margin-top:6px;}

.dots-wrap{background:#fff;padding:12px 12px 14px;border-bottom:1px solid #E2E8F0;overflow-x:auto;}
.dots{display:flex;gap:5px;justify-content:center;min-width:max-content;margin:0 auto;}
.dot{width:30px;height:30px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2.5px solid transparent;transition:all .15s;flex-shrink:0;}
.dot.future{background:#EDF2F7;color:#A0AEC0;}
.dot.today{background:#3182CE;color:#fff;}
.dot.done{background:#C6F6D5;color:#276749;}
.dot.partial{background:#FEFCBF;color:#744210;}
.dot.missed{background:#FED7D7;color:#9B2C2C;}
.dot.active{border-color:#3182CE !important;box-shadow:0 0 0 3px rgba(49,130,206,.25);}

.day-nav{background:#fff;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.nav-btn{background:#EDF2F7;border:none;border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#4A5568;transition:background .15s;}
.nav-btn:hover{background:#E2E8F0;}
.nav-btn:disabled{opacity:.3;cursor:default;}
.day-center{text-align:center;}
.day-title{font-size:17px;font-weight:700;color:#2D3748;}
.day-sub{font-size:12px;color:#718096;margin-top:2px;}

.content{max-width:560px;margin:0 auto;padding:14px 14px 0;}

.banner-future{background:#EBF8FF;border-radius:12px;padding:12px 16px;text-align:center;color:#2C5282;font-size:14px;font-weight:600;margin-bottom:12px;}
.banner-done{background:#F0FFF4;border-radius:12px;padding:12px 16px;text-align:center;color:#276749;font-size:14px;font-weight:600;margin-bottom:12px;}

/* PHASE BANNER */
.phase{border-radius:14px;padding:14px 16px;margin-bottom:14px;border:2px solid;}
.phase-ttl{font-size:14px;font-weight:800;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
.phase-txt{font-size:13px;line-height:1.5;}
.phase-1{background:#F0FFF4;border-color:#9AE6B4;color:#22543D;}
.phase-2{background:#FFFAF0;border-color:#FBD38D;color:#7B341E;}
.phase-3{background:#EBF8FF;border-color:#90CDF4;color:#2C5282;}
.phase-end{background:#F7FAFC;border-color:#CBD5E0;color:#4A5568;}

.card{background:#fff;border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.card-hdr{padding:13px 16px;display:flex;align-items:center;gap:10px;}
.card-hdr .icon{font-size:18px;}
.card-hdr h2{font-size:14px;font-weight:700;flex:1;}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(0,0,0,.08);}
.card-body{padding:0;}

.s-morning .card-hdr{background:linear-gradient(135deg,#FFFAF0,#FEEBC8);color:#7B341E;}
.s-noon .card-hdr{background:linear-gradient(135deg,#F0FFF4,#C6F6D5);color:#22543D;}
.s-evening .card-hdr{background:linear-gradient(135deg,#EBF8FF,#BEE3F8);color:#1A365D;}
.s-night .card-hdr{background:linear-gradient(135deg,#F7FAFC,#E2E8F0);color:#2D3748;}

.bp-row{display:flex;align-items:center;padding:12px 16px;gap:10px;border-bottom:1px solid #F7FAFC;}
.bp-lbl{font-size:13px;color:#718096;font-weight:600;white-space:nowrap;}
.bp-fields{display:flex;align-items:center;gap:6px;flex:1;}
.bp-in{width:68px;border:2px solid #E2E8F0;border-radius:10px;padding:8px 6px;font-size:17px;font-weight:700;text-align:center;font-family:inherit;transition:border-color .15s;background:#fff;}
.bp-in:focus{outline:none;border-color:#3182CE;}
.bp-in.ok{border-color:#48BB78;background:#F0FFF4;}
.bp-in.sys{color:#E53E3E;}
.bp-in.dia{color:#3182CE;}
.bp-in.pulse{color:#DD6B20;}
.bp-slash{font-size:20px;color:#CBD5E0;}
.bp-mmhg{font-size:11px;color:#A0AEC0;white-space:nowrap;}

.med-row{display:flex;align-items:center;padding:13px 16px;gap:13px;border-bottom:1px solid #F7FAFC;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s;}
.med-row:last-child{border-bottom:none;}
.med-row:active{background:#F7FAFC;}
.chk{width:28px;height:28px;border-radius:8px;border:2.5px solid #CBD5E0;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chk.on{background:#48BB78;border-color:#48BB78;}
.chk.on::after{content:'✓';color:#fff;font-size:16px;font-weight:800;}
.med-txt{flex:1;}
.med-name{font-size:15px;font-weight:600;color:#2D3748;line-height:1.3;}
.med-name.done{text-decoration:line-through;color:#A0AEC0;}
.med-dose{font-size:13px;color:#718096;margin-top:2px;}
.med-course{font-size:11px;color:#A0AEC0;margin-top:1px;}
.no-meds{padding:12px 16px;font-size:13px;color:#A0AEC0;text-align:center;}

.stats{background:#2D3748;border-radius:16px;padding:18px 16px;margin-top:4px;}
.stats h3{font-size:14px;font-weight:700;color:#E2E8F0;margin-bottom:14px;}
.stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.stat-name{font-size:13px;color:#A0AEC0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-bar{width:80px;height:6px;background:#4A5568;border-radius:3px;overflow:hidden;flex-shrink:0;}
.stat-fill{height:100%;background:#48BB78;border-radius:3px;transition:width .3s;}
.stat-pct{font-size:12px;color:#718096;width:32px;text-align:right;font-weight:700;flex-shrink:0;}
</style>
</head>
<body>

<div class="hdr">
  <h1>💊 График приёма</h1>
  <div class="dates">08 сентября — 07 октября 2026</div>
  <div class="g-bar-wrap"><div class="g-bar" id="gBar" style="width:0%"></div></div>
  <div class="g-label" id="gLabel">Загрузка…</div>
</div>

<div class="dots-wrap"><div class="dots" id="dots"></div></div>

<div class="day-nav">
  <button class="nav-btn" id="btnP" onclick="go(-1)">‹</button>
  <div class="day-center">
    <div class="day-title" id="dTitle"></div>
    <div class="day-sub" id="dSub"></div>
  </div>
  <button class="nav-btn" id="btnN" onclick="go(1)">›</button>
</div>

<div class="content" id="main"></div>

<script>
const START = new Date(2026,8,8);
const N = 30;
const WD = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MO = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

let cur = 0;

function dFor(i){const d=new Date(START);d.setDate(d.getDate()+i);return d;}
function dKey(i){const d=dFor(i);return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function p(n){return String(n).padStart(2,'0');}
function load(i){return JSON.parse(localStorage.getItem('mt_'+dKey(i))||'{}');}
function save(i,data){localStorage.setItem('mt_'+dKey(i),JSON.stringify(data));}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
function dDate(i){const d=dFor(i);d.setHours(0,0,0,0);return d;}

function meds(i){
  const m={morning:[],noon:[],evening:[],night:[]};
  // 7-дневные (дни 1–7, i=0..6)
  if(i<7){
    m.morning.push({id:'hgp',name:'Ху Гань Пянь',dose:'3 таблетки',course:'дни 1–7'});
    m.noon.push   ({id:'hgp',name:'Ху Гань Пянь',dose:'3 таблетки',course:'дни 1–7'});
    m.evening.push({id:'hgp',name:'Ху Гань Пянь',dose:'3 таблетки',course:'дни 1–7'});
    m.morning.push({id:'chsh',name:'Чай Ху Шу Гань',dose:'8 шариков',course:'дни 1–7'});
    m.noon.push   ({id:'chsh',name:'Чай Ху Шу Гань',dose:'8 шариков',course:'дни 1–7'});
    m.evening.push({id:'chsh',name:'Чай Ху Шу Гань',dose:'8 шариков',course:'дни 1–7'});
  }
  // 14-дневные (дни 1–14, i=0..13) — ПРОДОЛЖАЮТСЯ после 7-го дня
  if(i<14){
    m.morning.push({id:'thsyt',name:'Тао Хун Сы У Тан',dose:'8 шариков',course:'дни 1–14'});
    m.noon.push   ({id:'thsyt',name:'Тао Хун Сы У Тан',dose:'8 шариков',course:'дни 1–14'});
    m.evening.push({id:'thsyt',name:'Тао Хун Сы У Тан',dose:'8 шариков',course:'дни 1–14'});
    m.evening.push({id:'qjdh',name:'Ци Цзюй Ди Хуан Вань',dose:'12 шариков',course:'дни 1–14'});
  }
  // Магний (дни 1–30)
  m.night.push({id:'mag',name:'Магний',dose:'1 приём',course:'дни 1–30'});
  return m;
}

function phaseBanner(i){
  if(i<7){
    return `<div class="phase phase-1">
      <div class="phase-ttl">🟢 Период 1 · дни 1–7 (08–14 сен)</div>
      <div class="phase-txt">Принимаете <b>все препараты</b>: Ху Гань Пянь + Чай Ху Шу Гань + Тао Хун Сы У Тан + Ци Цзюй Ди Хуан Вань + Магний.</div>
    </div>`;
  } else if(i<14){
    return `<div class="phase phase-2">
      <div class="phase-ttl">🟡 Период 2 · дни 8–14 (15–21 сен)</div>
      <div class="phase-txt"><b>7-дневные завершены</b> (Ху Гань Пянь, Чай Ху Шу Гань). Продолжаете: <b>Тао Хун Сы У Тан</b> (3 раза), <b>Ци Цзюй Ди Хуан Вань</b> (вечером), <b>Магний</b> (на ночь).</div>
    </div>`;
  } else {
    return `<div class="phase phase-3">
      <div class="phase-ttl">🔵 Период 3 · дни 15–30 (22 сен–07 окт)</div>
      <div class="phase-txt">Все травяные курсы завершены. Остаётся только <b>Магний на ночь</b> (до 07 октября).</div>
    </div>`;
  }
}

function complete(i){
  const d=load(i);const m=meds(i);
  let tot=2,done=0;
  ['morning','noon','evening','night'].forEach(s=>m[s].forEach(x=>{tot++;if(d[s+'_'+x.id])done++;}));
  if(d.bp_m_s&&d.bp_m_d)done++;
  if(d.bp_e_s&&d.bp_e_d)done++;
  return {done,tot,pct:tot?done/tot:0};
}

function renderDots(){
  const el=document.getElementById('dots');
  el.innerHTML='';
  const t=today0();
  for(let i=0;i<N;i++){
    const dd=dDate(i);
    const dot=document.createElement('div');
    dot.className='dot';
    dot.textContent=dFor(i).getDate();
    dot.title=fmt(i);
    dot.onclick=()=>{cur=i;render();};
    if(i===cur)dot.classList.add('active');
    if(dd>t){dot.classList.add('future');}
    else if(dd.getTime()===t.getTime()){dot.classList.add('today');}
    else{
      const c=complete(i).pct;
      dot.classList.add(c>=0.99?'done':c>0?'partial':'missed');
    }
    el.appendChild(dot);
  }
}

function fmt(i){const d=dFor(i);return `${WD[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]}`;}

function toggle(i,slot,id){
  const d=load(i);
  d[slot+'_'+id]=!d[slot+'_'+id];
  save(i,d);render();
}

function bpSave(i,field){
  const val=document.getElementById('bp_'+i+'_'+field);
  if(!val)return;
  const d=load(i);
  d[field]=val.value.trim();
  save(i,d);
  val.classList.toggle('ok',!!val.value.trim());
  renderDots();updateGP();
}

function medRow(i,slot,med,data){
  const k=slot+'_'+med.id;
  const on=!!data[k];
  return `<div class="med-row" onclick="toggle(${i},'${slot}','${med.id}')">
    <div class="chk${on?' on':''}"></div>
    <div class="med-txt">
      <div class="med-name${on?' done':''}">${med.name}</div>
      <div class="med-dose">${med.dose}</div>
      <div class="med-course">Курс: ${med.course}</div>
    </div>
  </div>`;
}

function bpRow(i,data,when){
  const w=when[0];
  const sk=`bp_${w}_s`,dk=`bp_${w}_d`,pk=`bp_${w}_p`;
  const sv=data[sk]||'',dv=data[dk]||'',pv=data[pk]||'';
  const lbl=when==='morning'?'утром':'вечером';
  return `<div class="bp-row">
    <div class="bp-lbl">❤️ Давление ${lbl}</div>
    <div class="bp-fields">
      <input id="bp_${i}_${sk}" class="bp-in sys${sv?' ok':''}" type="number" inputmode="numeric" placeholder="120" value="${sv}" onblur="bpSave(${i},'${sk}')">
      <span class="bp-slash">/</span>
      <input id="bp_${i}_${dk}" class="bp-in dia${dv?' ok':''}" type="number" inputmode="numeric" placeholder="80" value="${dv}" onblur="bpSave(${i},'${dk}')">
      <span class="bp-mmhg">мм рт.ст.</span>
    </div>
  </div>
  <div class="bp-row">
    <div class="bp-lbl">💓 Пульс ${lbl}</div>
    <div class="bp-fields">
      <input id="bp_${i}_${pk}" class="bp-in pulse${pv?' ok':''}" type="number" inputmode="numeric" placeholder="70" value="${pv}" onblur="bpSave(${i},'${pk}')">
      <span class="bp-mmhg">уд/мин</span>
    </div>
  </div>`;
}

function cardDone(i,slot,list,data,hasBP){
  let done=list.filter(m=>!!data[slot+'_'+m.id]).length;
  let tot=list.length;
  if(hasBP){tot++;
    const t=slot==='morning'?'m':'e';
    if(data[`bp_${t}_s`]&&data[`bp_${t}_d`])done++;
  }
  return `${done}/${tot}`;
}

function renderStats(){
  const t=today0();
  const defs=[
    {id:'hgp',name:'Ху Гань Пянь',tot:21,slots:['morning','noon','evening'],days:7},
    {id:'chsh',name:'Чай Ху Шу Гань',tot:21,slots:['morning','noon','evening'],days:7},
    {id:'thsyt',name:'Тао Хун Сы У Тан',tot:42,slots:['morning','noon','evening'],days:14},
    {id:'qjdh',name:'Ци Цзюй Ди Хуан Вань',tot:14,slots:['evening'],days:14},
    {id:'mag',name:'Магний',tot:30,slots:['night'],days:30},
  ];
  let h=`<div class="stats"><h3>📊 Прогресс по препаратам</h3>`;
  defs.forEach(def=>{
    let done=0;
    for(let i=0;i<def.days;i++){
      if(dDate(i)>t)break;
      const d=load(i);
      def.slots.forEach(s=>{if(d[s+'_'+def.id])done++;});
    }
    const pct=Math.round(done/def.tot*100);
    h+=`<div class="stat-row">
      <div class="stat-name">${def.name}</div>
      <div class="stat-bar"><div class="stat-fill" style="width:${pct}%"></div></div>
      <div class="stat-pct">${pct}%</div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function updateGP(){
  const t=today0();
  let sum=0,cnt=0;
  for(let i=0;i<N;i++){if(dDate(i)>t)break;sum+=complete(i).pct;cnt++;}
  const pct=cnt?Math.round(sum/cnt*100):0;
  document.getElementById('gBar').style.width=pct+'%';
  document.getElementById('gLabel').textContent=`День ${cnt} из ${N} · Выполнено ${pct}%`;
}

function render(){
  const i=cur;
  const m=meds(i);
  const data=load(i);
  const t=today0();
  const dd=dDate(i);
  const isFut=dd>t;
  const isTod=dd.getTime()===t.getTime();

  document.getElementById('dTitle').textContent=fmt(i);
  document.getElementById('dSub').textContent=`День ${i+1} из ${N}${isTod?' · Сегодня':''}`;
  document.getElementById('btnP').disabled=i===0;
  document.getElementById('btnN').disabled=i===N-1;

  renderDots();updateGP();

  const c=complete(i);
  let html='';

  if(isFut) html+=`<div class="banner-future">📅 Этот день впереди — можно открыть заранее</div>`;
  else if(!isTod&&c.pct>=0.99) html+=`<div class="banner-done">✅ День завершён полностью</div>`;

  html+=phaseBanner(i);

  html+=`<div class="card s-morning">
    <div class="card-hdr"><span class="icon">🌅</span><h2>Утро</h2>
      <span class="badge">${cardDone(i,'morning',m.morning,data,true)}</span></div>
    <div class="card-body">
      ${bpRow(i,data,'morning')}
      ${m.morning.map(x=>medRow(i,'morning',x,data)).join('')}
      ${!m.morning.length?'<div class="no-meds">Препаратов утром нет</div>':''}
    </div>
  </div>`;

  if(m.noon.length){
    html+=`<div class="card s-noon">
      <div class="card-hdr"><span class="icon">☀️</span><h2>День</h2>
        <span class="badge">${cardDone(i,'noon',m.noon,data,false)}</span></div>
      <div class="card-body">${m.noon.map(x=>medRow(i,'noon',x,data)).join('')}</div>
    </div>`;
  }

  html+=`<div class="card s-evening">
    <div class="card-hdr"><span class="icon">🌙</span><h2>Вечер</h2>
      <span class="badge">${cardDone(i,'evening',m.evening,data,true)}</span></div>
    <div class="card-body">
      ${m.evening.map(x=>medRow(i,'evening',x,data)).join('')}
      ${!m.evening.length?'<div class="no-meds">Препаратов вечером нет</div>':''}
      ${bpRow(i,data,'evening')}
    </div>
  </div>`;

  html+=`<div class="card s-night">
    <div class="card-hdr"><span class="icon">💤</span><h2>Ночь</h2>
      <span class="badge">${cardDone(i,'night',m.night,data,false)}</span></div>
    <div class="card-body">${m.night.map(x=>medRow(i,'night',x,data)).join('')}</div>
  </div>`;

  html+=renderStats();
  document.getElementById('main').innerHTML=html;
}

function go(d){cur=Math.max(0,Math.min(N-1,cur+d));render();window.scrollTo({top:0,behavior:'smooth'});}

(function(){
  const t=today0();
  const diff=Math.floor((t-new Date(START))/86400000);
  cur=Math.max(0,Math.min(N-1,diff));
  render();
})();
</script>
</body>
</html>
