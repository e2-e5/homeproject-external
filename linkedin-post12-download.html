<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn · День 12 · Home Project</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0D1117;color:#F2F0EB;font-family:system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:24px;gap:20px}
  .label{font-size:13px;font-weight:600;color:rgba(242,240,235,0.4);letter-spacing:.08em;text-transform:uppercase}
  .frame{width:min(800px,100%);border-radius:12px;overflow:hidden;
         box-shadow:0 20px 60px rgba(0,0,0,.7);background:#111}
  .frame img{width:100%;display:block}
  .btn{display:inline-flex;align-items:center;gap:10px;
       background:linear-gradient(135deg,#818CF8,#4ADE80);
       color:#0D1117;font-weight:800;font-size:17px;
       padding:16px 40px;border-radius:14px;border:none;
       cursor:pointer;transition:opacity .2s;letter-spacing:.02em}
  .btn:hover{opacity:.85}
  .hint{font-size:12px;color:rgba(242,240,235,0.25);text-align:center;max-width:400px;line-height:1.6}
  .status{font-size:13px;color:#4ADE80;min-height:20px}
</style>
</head>
<body>
<p class="label">HOME PROJECT · LinkedIn · День 12</p>

<div class="frame">
  <img id="img" src="https://80.91.86.53.nip.io/api/file?path=docs/marketing/social/linkedin-post12-day12.jpg" crossorigin="anonymous" alt="LinkedIn Day 12">
</div>

<button class="btn" onclick="dl()">⬇ Скачать JPEG для LinkedIn</button>
<p class="status" id="st"></p>
<p class="hint">1200 × 628 px · рекомендованный размер LinkedIn<br>На телефоне: долгое нажатие на картинку → «Сохранить»</p>

<script>
async function dl(){
  const st = document.getElementById('st');
  st.textContent = 'Загружаю...';
  try {
    const res = await fetch('https://80.91.86.53.nip.io/api/file?path=docs/marketing/social/linkedin-post12-day12.jpg');
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'linkedin-homeproject-day12.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    st.textContent = '✓ Файл сохранён';
  } catch(e){
    st.textContent = 'Ошибка — попробуй долгое нажатие на картинку';
  }
}
</script>
</body>
</html>
