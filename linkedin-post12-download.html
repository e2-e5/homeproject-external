<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn · День 12 · Home Project</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0D1117;color:#F2F0EB;font-family:system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:24px;gap:20px}
  .label{font-size:12px;font-weight:700;color:rgba(242,240,235,0.35);letter-spacing:.1em;text-transform:uppercase}
  .frame{width:min(860px,100%);border-radius:12px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.75)}
  .frame img{width:100%;display:block}
  .btn{display:inline-flex;align-items:center;gap:12px;
       background:linear-gradient(135deg,#818CF8,#4ADE80);
       color:#0D1117;font-weight:800;font-size:18px;
       padding:18px 44px;border-radius:14px;border:none;
       cursor:pointer;transition:opacity .15s;letter-spacing:.02em}
  .btn:hover{opacity:.82}
  .hint{font-size:12px;color:rgba(242,240,235,0.22);text-align:center;max-width:440px;line-height:1.7}
  .status{font-size:14px;color:#4ADE80;min-height:22px;font-weight:600}
</style>
</head>
<body>
<p class="label">HOME PROJECT · LinkedIn · День 12 · 1200×628 px</p>
<div class="frame">
  <img id="img" src="https://new.homeproject.online/static/1786278411040-linkedin-post12-day12.jpg" alt="LinkedIn Day 12">
</div>
<button class="btn" onclick="dl()">⬇&nbsp; Скачать для LinkedIn</button>
<p class="status" id="st"></p>
<p class="hint">JPEG · 1200×628 px<br>На телефоне: долгое нажатие на картинку → «Сохранить»</p>
<script>
const IMG='https://new.homeproject.online/static/1786278411040-linkedin-post12-day12.jpg';
async function dl(){
  const st=document.getElementById('st');
  st.textContent='Загружаю...';
  try{
    const res=await fetch(IMG);
    if(!res.ok)throw new Error(res.status);
    const blob=await res.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='linkedin-homeproject-day12.jpg';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    st.textContent='✓ Файл сохранён — загружай в LinkedIn';
  }catch(e){
    window.open(IMG,'_blank');
    st.textContent='Откроется в новой вкладке — сохрани через Ctrl+S';
  }
}
</script>
</body>
</html>
