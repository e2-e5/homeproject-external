<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>База для Coldy — Home Project</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #0f1117; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { background: #1a1d27; border-radius: 16px; padding: 48px 40px; text-align: center; border: 1px solid #2a2d3a; max-width: 440px; width: 90%; }
  h1 { font-size: 22px; color: #fff; margin: 0 0 12px; }
  p { color: #888; font-size: 13px; margin: 0 0 32px; line-height: 1.7; }
  .btn { background: #4f8ef7; color: #fff; border: none; padding: 16px 40px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #3a7de0; }
  .note { color: #555; font-size: 11px; margin-top: 20px; line-height: 1.6; }
  .badge { background: #0d2e1c; color: #4caf82; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; display: inline-block; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="box">
  <div class="badge">✓ 746 контактов</div>
  <h1>База для Coldy</h1>
  <p><strong>warm-contacts-aug26.csv</strong><br>Дизайнеры и архитекторы — получали письма в июле 2026, не отписались.<br>Готово для загрузки в кампанию «Re-engage Aug26».</p>
  <button class="btn" onclick="dl()">⬇ Скачать CSV</button>
  <div class="note">После скачивания: Coldy → Кампания → «Загрузить базу» → выбери этот файл</div>
</div>
<script>
function dl(){
  var b="PLACEHOLDER_B64";
  var bin=atob(b), arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  var blob=new Blob([arr],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="warm-contacts-aug26.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}
</script>
</body>
</html>
